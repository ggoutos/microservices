services:
  accounts:
    image: ggoutos/accounts:latest
    container_name: accounts-ms
#    build:
#      context: .
#      target: jvm
    ports:
      - "8080:8080"
    deploy:
        resources:
            limits:
              cpus: '0.50'
              memory: 512M
    networks:
      - microservices-network
  cards:
    image: ggoutos/cards:latest
    container_name: cards-ms
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - microservices-network
  loans:
    image: ggoutos/loans:latest
    container_name: loans-ms
    ports:
      - "8090:8090"
    environment:
      # BPL_JVM_THREAD_COUNT Tells Paketo memory calculator the expected thread count
      - BPL_JVM_THREAD_COUNT=50
      # XX:ActiveProcessorCount Aligns JVM CPU detection with the container's CPU limit
      # Xss256k Reduces per-thread stack size from default 1MB to 256KB
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=1 -Xss256k
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    networks:
      - microservices-network
networks:
  microservices-network:
    driver: bridge