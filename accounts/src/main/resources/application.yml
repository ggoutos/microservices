server:
  port: 8080

logging:
  level:
    org.springframework: warn
    org.apache.kafka: error
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

build:
  version: "0.0.1-SNAPSHOT"

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh, busrefresh, shutdown, metrics, prometheus  # Don't expose 'env' or 'configprops'
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
  metrics:
    tags:
        application: ${spring.application.name}

otel:
  service:
    name: ${spring.application.name}

spring:
  application:
    name: accounts
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USER:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  cloud:
    kubernetes:
      discovery:
        all-namespaces: true
        discovery-server-url: ${SPRING.CLOUD.KUBERNETES.DISCOVERY.DISCOVERY-SERVER-URL:http://spring-cloud-kubernetes-discoveryserver:80/}
    config:
      uri: http://${CONFIG_SERVER_HOST:localhost}:8071
      username: ${CONFIG_SERVER_USER}
      password: ${CONFIG_SERVER_PASSWORD}
    openfeign:
      circuitbreaker:
        enabled: true
    function:
      definition: updateCommunication
    stream:
      default-binder: ${SPRING_CLOUD_STREAM_DEAFULT_BINDER:kafka} # This line specifies the default binder to use. You can change it to 'rabbit' if you want to use RabbitMQ.
      bindings:
        sendCommunication-out-0:
          destination: send-communication
        updateCommunication-in-0:
          destination: communication-sent
          group: ${spring.application.name}
      kafka:
        binder:
          brokers:
            - ${KAFKA_HOST:localhost}:9092
      binders:
        rabbit:
          type: rabbit
          environment:
            spring:
              rabbitmq:
                host: ${RABBITMQ_HOST:localhost}
                port: 5672
                username: ${SPRING_RABBITMQ_USER:guest}
                password: ${SPRING_RABBITMQ_PASSWORD:guest}
        kafka:
          type: kafka
          environment:
            spring:
              kafka:
                bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost}:9092
                consumer:
                  auto-offset-reset: earliest
                producer:
                  acks: all
  config:
    import: "configserver:${spring.cloud.config.uri}"

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10 # that many requests will be considered for calculating the failure rate
      permittedNumberOfCallsInHalfOpenState: 2 # that many requests will be allowed in half-open state
      failureRateThreshold: 50 # % of requests must fail for the circuit breaker to trip
      waitDurationInOpenState: 10000 # how long the circuit breaker should stay in the open state before transitioning to half-open

resilience4j.timelimiter:
  configs:
    default:
      timeoutDuration: 4s # how long the call should be allowed to take before timing out

resilience4j.retry:
  configs:
    default:
      maxAttempts: 3
      waitDuration: 500
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2
      ignoreExceptions: # ignore these exceptions and don't retry -> go to fallback method directly
        - java.lang.NullPointerException
      retryExceptions: # retry these exceptions -> if maxAttempts is reached, then go to fallback method, if set then ignoreExceptions is ignored
        - java.util.concurrent.TimeoutException

# RateLimiter no Redis required, as it is based on a simple token bucket algorithm that can be implemented in-memory.
# However, if you want to use a distributed rate limiter that can be shared across multiple instances of your application,
# you can use Redis as a backend for storing the rate limiter state. In that case, you would need to configure the
# Redis connection and use a Redis-based implementation of the rate limiter, such as the one provided by Resilience4j.
resilience4j.ratelimiter:
  configs:
    default:
      timeoutDuration: 1000 # how long a thread can wait in ms for a response before throwing a RequestNotPermitted exception, default is 5s
      limitRefreshPeriod: 1000 # the bucket is refilled every x milliseconds
      limitForPeriod: 10 # how many requests can be made until the bucket is refilled

info:
  app:
    name: accounts
    description: Eazybank Accounts microservice
    version: 1.0.0

