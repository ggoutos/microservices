# DestinationRules - Traffic Policies, Circuit Breaking, Outlier Detection
# These configurations define connection pool settings, circuit breaking, and mTLS policies

# ===========================================
# Accounts Service DestinationRule
# ===========================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: accounts
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: destination-rule-accounts
spec:
  host: accounts
  trafficPolicy:
    # Connection pool settings
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 5s
        keepAlive: {}
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 2
        maxRetries: 3
        perTryTimeout: 2s
    
    # Circuit breaker (outlier detection)
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
  
  # Subsets for canary deployments
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2

---
