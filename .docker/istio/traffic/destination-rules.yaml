# ===========================================
# Instructions for Circuit Breaking Testing
# ===========================================
# To test circuit breaking:
#
# 1. Apply the DestinationRules:
#    kubectl apply -f traffic/destination-rules.yaml
#
# 2. Check the configuration:
#    kubectl get destinationrules -n microservices
#
# 3. Test with load:
#    # Generate load to trigger circuit breaker
#    for i in {1..100}; do curl -s -o /dev/null http://accounts:8080/api/fetch?mobileNumber=123; done
#
# 4. Check outlier detection:
#    istioctl proxy-config cluster <pod-name> -n microservices
#
# 5. Monitor circuit breaker metrics:
#    # Port-forward to Prometheus
#    kubectl port-forward -n prometheus svc/prometheus 9090:9090
#    # Visit http://localhost:9090 and query:
#    - envoy_cluster_outlier_detection_ejections_active
#    - envoy_cluster_circuit_breakers_default_cx_pool_open_or_else_monitored
