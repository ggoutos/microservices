---
# ==========================================
# ServiceEntry for Eureka Server (if needed)
# Eureka uses peer-to-peer replication
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: eurekaserver-external
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: service-entry-eurekaserver
spec:
  hosts:
  - eurekaserver.microservices.svc.cluster.local
  ports:
  - number: 8070
    name: http
    protocol: HTTP
  location: MESH_INTERNAL
  resolution: STATIC
  endpoints:
  - address: 127.0.0.1  # Eureka pod IP (will be resolved by K8s DNS)
    ports:
      http: 8070

---
# ==========================================
# Instructions for ServiceEntry
# ==========================================
# To apply ServiceEntry resources:
#
# 1. Apply all ServiceEntries:
#    kubectl apply -f traffic/service-entries.yaml
#
# 2. Verify ServiceEntries:
#    kubectl get serviceentry -n microservices
#    kubectl describe serviceentry keycloak-external -n microservices
#
# 3. Test external access:
#    # Exec into a pod
#    kubectl exec -it <pod-name> -n microservices -- /bin/sh
#
#    # Test Keycloak connectivity
#    curl -v http://keycloak:8080/realms/master
#
# 4. Monitor external traffic:
#    # Check proxy config
#    istioctl proxy-config cluster <pod-name> -n microservices | grep keycloak
#
#    # View access logs
#    kubectl logs <pod-name> -c istio-proxy -n microservices | grep keycloak
#
# 5. If using Egress Gateway:
#    # Create ServiceEntry for egress
#    # Create VirtualService to route through egress gateway
#    # See: https://istio.io/latest/docs/tasks/traffic-management/egress/egress-gateway/
