# ServiceEntry - External Services Configuration
# These configurations register external services with the Istio service mesh.

# ==========================================
# Keycloak External Service Entry
# Allows services in the mesh to access external Keycloak instance
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: keycloak-external
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: service-entry-keycloak
spec:
  hosts:
  - keycloak.eazybank.com  # Change to your Keycloak hostname
  - keycloak  # Internal service name (if running in cluster)
  ports:
  - number: 80
    name: http
    protocol: HTTP
  - number: 443
    name: https
    protocol: HTTPS
  - number: 8080
    name: http-alt
    protocol: HTTP
  location: MESH_EXTERNAL  # External to the mesh
  resolution: DNS  # Use DNS resolution

---
# ==========================================
# Keycloak Internal ServiceEntry (if running in cluster)
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: keycloak-internal
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: service-entry-keycloak-internal
spec:
  hosts:
  - keycloak.default.svc.cluster.local
  - keycloak
  ports:
  - number: 8080
    name: http
    protocol: HTTP
  location: MESH_INTERNAL
  resolution: STATIC
  endpoints:
  - address: keycloak.default.svc.cluster.local
    ports:
      http: 8080

---
# ==========================================
# Git Repository (for ConfigServer)
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: git-repo-external
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: service-entry-git
spec:
  hosts:
  - github.com  # Or your Git server hostname
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  - number: 80
    name: http
    protocol: HTTP
  location: MESH_EXTERNAL
  resolution: DNS

