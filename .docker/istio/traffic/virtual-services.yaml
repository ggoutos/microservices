# VirtualServices - Routing Rules, Retries, Timeouts
# These configurations define how traffic is routed to services

# ==========================================
# Accounts Service VirtualService
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: accounts
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: virtual-service-accounts
spec:
  hosts:
  - accounts
  http:
  # Canary deployment example (10% to v2, 90% to v1)
  - match:
    - headers:
        x-user-type:
          exact: test
    route:
    - destination:
        host: accounts
        subset: v2
      weight: 100
  - route:
    - destination:
        host: accounts
        subset: v1
      weight: 90
    - destination:
        host: accounts
        subset: v2
      weight: 10
    # Retry policy
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,reset,connect-failure,refused-stream
    # Timeout
    timeout: 5s
    # CORS policy
    corsPolicy:
      allowOrigins:
      - exact: "http://localhost:3000"
      - exact: "http://eazybank.com"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      allowHeaders:
      - "eazybank-correlation-id"
      - "Authorization"
      - "x-user-id"

---
# ==========================================
# Cards Service VirtualService
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cards
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: virtual-service-cards
spec:
  hosts:
  - cards
  http:
  - route:
    - destination:
        host: cards
        subset: v1
      weight: 100
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,reset
    timeout: 5s

---
