---
# ==========================================
# Message Service VirtualService
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: message
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: virtual-service-message
spec:
  hosts:
  - message
  http:
  - route:
    - destination:
        host: message
        subset: v1
      weight: 100
    timeout: 10s  # Longer timeout for message processing

---
# ==========================================
# GatewayServer VirtualService
# Routes external traffic from Istio Ingress Gateway
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: gatewayserver
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: virtual-service-gatewayserver
spec:
  hosts:
  - "eazybank.com"
  - "localhost"
  gateways:
  - eazybank-gateway
  http:
  # Route to accounts service
  - match:
    - uri:
        prefix: /goutos/bank/accounts
    route:
    - destination:
        host: accounts
        port:
          number: 8080
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 5s
  
  # Route to cards service
  - match:
    - uri:
        prefix: /goutos/bank/cards
    route:
    - destination:
        host: cards
        port:
          number: 9000
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 5s
  
  # Route to loans service
  - match:
    - uri:
        prefix: /goutos/bank/loans
    route:
    - destination:
        host: loans
        port:
          number: 8090
    retries:
      attempts: 3
      perTryTimeout: 2s
    timeout: 5s
  
  # Route to message service (if exposed externally)
  - match:
    - uri:
        prefix: /goutos/bank/message
    route:
    - destination:
        host: message
        port:
          number: 9010
    timeout: 10s

---
# ==========================================
# ConfigServer VirtualService
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: configserver
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: virtual-service-configserver
spec:
  hosts:
  - configserver
  http:
  - route:
    - destination:
        host: configserver
        subset: v1
      weight: 100
    timeout: 5s

---
# ==========================================
# Istio Ingress Gateway Configuration
# ==========================================
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: eazybank-gateway
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: istio-ingress-gateway
spec:
  selector:
    istio: ingressgateway  # Use Istio's ingress gateway
  servers:
  # HTTP server (redirect to HTTPS)
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*.eazybank.com"
    - "localhost"
    tls:
      httpsRedirect: true  # Redirect HTTP to HTTPS
  
  # HTTPS server
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "*.eazybank.com"
    - "localhost"
    tls:
      mode: SIMPLE
      credentialName: eazybank-tls-cert  # Kubernetes Secret with TLS cert

---
