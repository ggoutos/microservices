# Telemetry - Metrics, Traces, and Logs Collection
# This configuration enables observability for Istio service mesh.

# =========================================
# Global Telemetry Configuration
# Applies to all services in the namespace
# =========================================
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: eazybank-telemetry
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: telemetry-global
spec:
  # Metrics configuration
  metrics:
  - providers:
    - name: prometheus
    # Override metrics (optional)
    # overrides:
    # - match:
    #     metric: requests_total
    #   tags:
    #     destination_service_name: accounts
    #   value:
    #     operation: REPLACE
    #     value: "1"
  
  # Tracing configuration
  tracing:
  - providers:
    - name: tempo-otel  # Or use: jaeger, zipkin
    # Sampling rate (1.0 = 100%)
    randomSamplingPercentage: 100.0
  
    # Custom tags for tracing
    customTags:
      correlation_id:
        header:
          name: eazybank-correlation-id
      user_id:
        header:
          name: x-user-id
      source_ip:
        environment:
          name: NODE_IP
      request_id:
        header:
          name: x-request-id
  
  # Access logging configuration
  accessLogging:
  - providers:
    - name: otel  # OpenTelemetry format
      format: json

---
# =========================================
# Service-Specific Telemetry: Accounts
# =========================================
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: accounts-telemetry
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: telemetry-accounts
spec:
  selector:
    matchLabels:
      app: accounts
  tracing:
  - providers:
    - name: tempo-otel
    randomSamplingPercentage: 100.0
    customTags:
      service_name:
        literal:
          value: accounts-service

