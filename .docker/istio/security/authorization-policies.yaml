# AuthorizationPolicy - Service-to-Service Access Control
# These policies implement the principle of least privilege
# Only authorized services can access specific endpoints

# ============================================
# Global Deny-All Policy (Optional - Strict Security)
# Uncomment to deny all traffic by default, then add allow rules
# ============================================
# apiVersion: security.istio.io/v1beta1
# kind: AuthorizationPolicy
# metadata:
#   name: deny-all
#   namespace: microservices
# spec: {}  # Empty spec = deny all

# ============================================
# Accounts Service Authorization Policy
# Only allow specific services to access accounts
# ============================================
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: accounts-service-policy
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: authorization-policy-accounts
spec:
  # Apply to accounts service pods
  selector:
    matchLabels:
      app: accounts
  rules:
  # Rule 1: Allow gatewayserver to access accounts (external traffic)
  - from:
    - source:
        principals: ["cluster.local/ns/microservices/sa/gatewayserver-sa"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/*", "/actuator/health/*"]
  
  # Rule 2: Allow accounts to access cards and loans (inter-service calls)
  - from:
    - source:
        principals: ["cluster.local/ns/microservices/sa/accounts-sa"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/api/fetch"]
  
  # Rule 3: Allow health checks from istio-system (prometheus, etc.)
  - from:
    - source:
        namespaces: ["istio-system"]
    to:
    - operation:
        methods: ["GET"]
        paths: ["/actuator/health/*"]

---
