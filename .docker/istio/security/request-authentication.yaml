metadata:
  name: keycloak-jwt-accounts
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: request-authentication-accounts
spec:
  selector:
    matchLabels:
      app: accounts
  jwtRules:
  - issuer: "http://keycloak:8080/realms/master"
    jwksUri: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"
    outputPayloadToHeader: "x-jwt-payload"
    fromHeaders:
    - name: Authorization
      prefix: "Bearer "

