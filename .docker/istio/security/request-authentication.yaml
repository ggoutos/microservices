# RequestAuthentication - JWT Validation
# These policies validate JWT tokens (complementing Keycloak OAuth2)
# 
# Option A (Recommended): Keep OAuth2 at Gateway level
#   - Gateway validates JWT
#   - Pass validated identity via headers to backend
#   - Use mTLS for service-to-service encryption
#
# Option B: End-to-End OAuth2 with Istio
#   - Validate JWT at each service using Istio RequestAuthentication
#   - More secure but adds complexity

# ============================================
# Keycloak JWT Validation for GatewayServer
# Validate JWT tokens at the gateway level
# ============================================
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt-gatewayserver
  namespace: microservices
  labels:
    app.kubernetes.io/part-of: eazybank
    app.kubernetes.io/name: request-authentication-gatewayserver
spec:
  # Apply to gatewayserver pods
  selector:
    matchLabels:
      app: gatewayserver
  
  # JWT validation rules
  jwtRules:
  # Keycloak JWT validation
  - issuer: "http://keycloak:8080/realms/master"
    jwksUri: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"
    # Forward the original token to the application
    outputPayloadToHeader: "x-jwt-payload"
    # Token locations to check
    fromHeaders:
    - name: Authorization
      prefix: "Bearer "
    - name: x-access-token
    fromParams:
    - token
  
  # Optional: Validate audiences
  # audiences:
  #   - account
  #   - cards
  #   - loans

---
# ============================================
# Keycloak JWT Validation for Accounts Service
# (Optional - if implementing end-to-end JWT validation)
# ============================================
