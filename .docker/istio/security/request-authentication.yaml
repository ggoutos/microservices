# ============================================
# Instructions for JWT Integration
# ============================================
# To enable end-to-end JWT validation:
#
# 1. Apply RequestAuthentication resources:
#    kubectl apply -f security/request-authentication.yaml
#
# 2. Create AuthorizationPolicy to require JWT:
#    Uncomment the "require-jwt-*" policies above
#
# 3. Verify JWT validation:
#    # Without token (should fail):
#    curl http://localhost:8072/goutos/bank/accounts/api/fetch?mobileNumber=1234567890
#
#    # With token (should succeed):
#    TOKEN=$(curl -X POST http://keycloak:8080/realms/master/protocol/openid-connect/token \
#      -H 'Content-Type: application/x-www-form-urlencoded' \
#      -d 'grant_type=client_credentials&client_id=<client_id>&client_secret=<secret>' \
#      | jq -r '.access_token')
#    curl -H "Authorization: Bearer $TOKEN" \
#      http://localhost:8072/goutos/bank/accounts/api/fetch?mobileNumber=1234567890
#
# 4. Monitor JWT validation:
#    kubectl logs -n istio-system deployment/istiod | grep jwt
#
# Note: For the EazyBank platform, the recommended approach is:
#   - Keep OAuth2 JWT validation at Spring Cloud Gateway (existing)
#   - Use mTLS for service-to-service encryption (PeerAuthentication)
#   - Use AuthorizationPolicy for service-to-service access control
#   - Only enable RequestAuthentication if you need end-to-end JWT validation
