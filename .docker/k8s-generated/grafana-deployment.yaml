apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
    kompose.service.type: LoadBalancer
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: grafana
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
        kompose.service.type: LoadBalancer
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: grafana
    spec:
      containers:
        - command:
            - sh
            - -euc
            - |
              /run.sh
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Admin
            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning
          image: grafana/grafana:latest
          livenessProbe:
            exec:
              command:
                - wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: grafana
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: "536870912"
          volumeMounts:
            - mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              name: grafana-cm0
              subPath: datasource.yml
            - mountPath: /var/lib/grafana
              name: grafana-data
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: datasource.yml
                path: datasource.yml
            name: grafana-cm0
          name: grafana-cm0
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data
