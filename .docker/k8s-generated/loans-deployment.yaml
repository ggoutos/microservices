apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: loans
  name: loans
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: loans
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: loans
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: env
            - configMapRef:
                name: env-prod
          image: ggoutos/loans:jib
          livenessProbe:
            exec:
              command:
                - wget --no-verbose --tries=1 --spider http://localhost:8090/actuator/health/readiness || exit 1
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: loans-ms
          ports:
            - containerPort: 8090
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: "536870912"
      restartPolicy: Always
