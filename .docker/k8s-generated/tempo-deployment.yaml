apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: tempo
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tempo
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: tempo
    spec:
      containers:
        - args:
            - -config.file
            - /etc/tempo-config.yml
          image: grafana/tempo:latest
          name: tempo
          ports:
            - containerPort: 3100
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: "536870912"
          volumeMounts:
            - mountPath: /etc/tempo-config.yml
              name: tempo-cm0
              subPath: tempo-config.yml
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: tempo.yml
                path: tempo-config.yml
            name: tempo-cm0
          name: tempo-cm0
