apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
    kompose.service.type: LoadBalancer
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: eurekaserver
  name: eurekaserver
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: eurekaserver
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
        kompose.service.type: LoadBalancer
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: eurekaserver
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: env
            - configMapRef:
                name: env-prod
          image: ggoutos/eurekaserver:jib-k8s
          livenessProbe:
            exec:
              command:
                - wget --no-verbose --tries=1 --spider http://localhost:8070/actuator/health/readiness || exit 1
            failureThreshold: 10
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: eurekaserver-ms
          ports:
            - containerPort: 8070
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: "536870912"
      restartPolicy: Always
