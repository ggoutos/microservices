apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
    kompose.service.type: LoadBalancer
    kompose.version: 1.38.0 (a8f5d1cbd)
    kompose.volume.type: configMap
  labels:
    io.kompose.service: gateway
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gateway
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
        kompose.service.type: LoadBalancer
        kompose.version: 1.38.0 (a8f5d1cbd)
        kompose.volume.type: configMap
      labels:
        io.kompose.service: gateway
    spec:
      containers:
        - command:
            - sh
            - -euc
            - |
              cp /etc/nginx/nginx-template.conf /etc/nginx/nginx.conf
              /docker-entrypoint.sh nginx -g "daemon off;"
          image: nginx:latest
          livenessProbe:
            exec:
              command:
                - service
                - nginx
                - status
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 5
          name: loki-gateway
          ports:
            - containerPort: 3100
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: "536870912"
          volumeMounts:
            - mountPath: /etc/nginx/nginx-template.conf
              name: gateway-cm0
              readOnly: true
              subPath: nginx-template.conf
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: nginx.conf
                path: nginx-template.conf
            name: gateway-cm0
          name: gateway-cm0
