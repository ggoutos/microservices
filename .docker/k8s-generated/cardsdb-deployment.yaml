apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: cardsdb
  name: cardsdb
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: cardsdb
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -f docker-compose.yml -o k8s-generated
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: cardsdb
    spec:
      containers:
        - env:
            - name: MYSQL_DATABASE
              value: cardsdb
          envFrom:
            - configMapRef:
                name: env
            - configMapRef:
                name: env-prod
          image: mysql:lts
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            failureThreshold: 10
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          name: cards-db
          ports:
            - containerPort: 3306
              protocol: TCP
          resources:
            limits:
              cpu: 500m
              memory: "536870912"
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: cards-data
      restartPolicy: Always
      volumes:
        - name: cards-data
          persistentVolumeClaim:
            claimName: cards-data
