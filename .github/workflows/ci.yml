name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - uat
      - master
      - main
      - "feat/**"

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: "25"
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  verify:
    name: Build, Test, And Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Wrapper Executable
        run: chmod +x mvnw

      - name: Verify
        run: ./mvnw -B -ntp verify

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs:
      - verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Wrapper Executable
        run: chmod +x mvnw

      - name: Run Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          nvd_arg=""
          if [ -n "$NVD_API_KEY" ]; then
            nvd_arg="-DnvdApiKey=$NVD_API_KEY"
          fi

          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.1.0:check \
            -Dformats=HTML,JSON,SARIF \
            -DfailBuildOnCVSS=7 \
            $nvd_arg

      - name: Upload Dependency-Check Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: "**/target/dependency-check-report.*"
          if-no-files-found: ignore

  image-scan:
    name: Build And Scan ${{ matrix.module }} Image
    runs-on: ubuntu-latest
    needs:
      - verify
      - dependency-check
    strategy:
      fail-fast: false
      matrix:
        module:
          - configserver
          - eurekaserver
          - gatewayserver
          - accounts
          - cards
          - loans
          - message

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Wrapper Executable
        run: chmod +x mvnw

      - name: Build Docker Image With Jib
        run: |
          ./mvnw -B -ntp -pl "${{ matrix.module }}" -am -DskipTests compile jib:dockerBuild \
            -Djib.to.image="ggoutos/${{ matrix.module }}:${{ env.IMAGE_TAG }}"

      - name: Scan Docker Image With Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ggoutos/${{ matrix.module }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-${{ matrix.module }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.module }}.sarif
          category: trivy-${{ matrix.module }}
