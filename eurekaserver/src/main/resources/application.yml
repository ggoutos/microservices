server:
  port: 8070

logging:
  level:
    org.springframework: warn

eureka:
  instance:
    hostname: ${EUREKA_SERVER_HOST:localhost}
  client:
    register-with-eureka: false # don't register with eureka as a service as will never be called from other services directly
    fetch-registry: false # don't fetch registry from eureka as a service as will never call other services directly
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh, busrefresh, shutdown  # Don't expose 'env' or 'configprops'
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true


spring:
  application:
    name: eurekaserver